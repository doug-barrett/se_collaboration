fileVersion: 1
id: "76"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |
    capitalized: Stage with Tagging
    short: STG
    plural: Stages with Tagging
    tagColor: '#2EB67D'
    config:
    - groupName: Options
      items:
      - type: materializationSelector
        default: table
        options:
        - table
        - view
        isRequired: true
      - type: multisourceToggle
        enableIf: "{% if node.materializationType == 'table' %} true {% else %} false {% endif %}" 
      - type: overrideSQLToggle
        enableIf: "{% if node.materializationType == 'view' %} true {% else %} false {% endif %}"
        
      - displayName: Multi Source Strategy
        attributeName: insertStrategy
        type: dropdownSelector
        default: INSERT
        options:
        - "INSERT"
        - "UNION"
        - "UNION ALL"
        isRequired: true
        enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"
      - displayName: Truncate Before
        attributeName: truncateBefore
        type: toggleButton
        default: true
      - displayName: Enable Tests
        attributeName: testsEnabled
        type: toggleButton
        default: true
        
      - displayName: Pre-SQL
        attributeName: preSQL
        type: textBox
        syntax: sql
        isRequired: false
      - displayName: Post-SQL
        attributeName: postSQL
        type: textBox
        syntax: sql
        isRequired: false
    - groupName: 'Table Tagging'
      items:
      - displayName: Domain Tag
        attributeName: domainTag
        type: dropdownSelector
        options:
        - "step service"
        - "finance"
        - "people"
        isRequired: false
    - groupName: 'Column Tagging'
      items:
      - type: tabular
        displayName: Column-level PII tags
        attributeName: columnTaggingTabular
        isRequired: false
        columns:
        - type: columnDropdownSelector
          displayName: Column
          attributeName: taggedColumns
          isRequired: true
        - type: dropdownSelector
          displayName: PII Sensitivity
          attributeName: piiSensitivity
          options:
          - "direct"
          - "indirect"
          - "protected"
          isRequired: false
name: Stage with Tagging
type: NodeType
